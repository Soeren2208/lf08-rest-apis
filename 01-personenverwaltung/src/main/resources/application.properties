spring.application.name=personenverwaltung

# --- Datenbank ------------------------------------------------------------
# H2 als In-Memory-Datenbank: Die Daten liegen nur im Hauptspeicher und sind
# nach dem Beenden der Anwendung wieder weg. Fuer die Entwicklung ideal,
# weil kein Datenbankserver installiert werden muss.
spring.datasource.url=jdbc:h2:mem:persondb
spring.datasource.username=sa
spring.datasource.password=

# --- H2-Console -----------------------------------------------------------
# Web-Oberflaeche der Datenbank unter http://localhost:8080/h2-console
spring.h2.console.enabled=true

# --- Hibernate ------------------------------------------------------------
# Zeigt die erzeugten SQL-Anweisungen im Log an - sehr hilfreich zum Verstehen.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Bewusst abgeschaltet: haelt die Datenbankverbindung nicht laenger offen
# als noetig. Ohne diese Zeile gibt Spring Boot beim Start eine Warnung aus.
spring.jpa.open-in-view=false

# --- Fehlerantworten ------------------------------------------------------
# Ohne diese Zeile haengt Spring Boot DevTools an jede Fehlerantwort einen
# kompletten Stacktrace - unuebersichtlich und ein Sicherheitsrisiko, weil
# der Aufrufer Interna der Anwendung erfaehrt.
server.error.include-stacktrace=never

# Fehlerantworten im Standardformat RFC 9457 ("Problem Details").
# Statt einer selbst erfundenen Struktur liefert die API damit ein Format,
# das andere Werkzeuge und Programme verstehen.
spring.mvc.problemdetails.enabled=true

# --- Actuator -------------------------------------------------------------
# Der Health-Endpunkt ist standardmaessig freigegeben und unter
# http://localhost:8080/actuator/health erreichbar.
