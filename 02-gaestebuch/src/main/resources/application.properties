spring.application.name=gaestebuch

# --- Datenbank -----------------------------------------------------------
# Anders als im ersten Tutorial speichert H2 hier in eine DATEI.
# Die Eintraege ueberleben damit einen Neustart der Anwendung.
# Die Datei liegt im Projektverzeichnis unter data/guestbookdb.mv.db
spring.datasource.url=jdbc:h2:file:./data/guestbookdb
spring.datasource.username=sa
spring.datasource.password=

# --- H2-Console ----------------------------------------------------------
spring.h2.console.enabled=true

# --- Hibernate -----------------------------------------------------------
# update statt create-drop: vorhandene Tabellen bleiben erhalten.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Fehlerantworten -----------------------------------------------------
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# --- API-Dokumentation ---------------------------------------------------
# Oberflaeche unter http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
